<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASIVARASHOP - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto p-4 md:p-8">
    <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
      <h1 class="text-2xl font-bold text-red-500">⚙️ ASIVARASHOP Admin Dashboard</h1>
      <a href="index.html" target="_blank" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">ดูหน้าเว็บ</a>
    </header>

    <!-- ฟอร์มเพิ่มสินค้าใหม่ -->
    <section class="bg-slate-800 p-6 rounded-2xl mb-8 border border-slate-700">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-plus-circle text-green-400"></i> เพิ่มสินค้าไอดีเกม</h2>
      <form id="add-product-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">เลือกเกม</label>
          <select id="prod-game" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm" required></select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">ชื่อรหัสไอดี / หัวข้อสินค้า</label>
          <input type="text" id="prod-title" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm" placeholder="เช่น eFootball ไอดีติดเมต้า ฟูลทีม" required>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1">ราคา (บาท)</label>
            <input type="number" id="prod-price" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm" placeholder="500" required>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">จำนวนสต็อก</label>
            <input type="number" id="prod-stock" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm" value="1" required>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">รายละเอียดไอดี</label>
          <textarea id="prod-desc" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm h-24" placeholder="รายละเอียดฮีโร่ สกิน แต้ม หรือเงื่อนไขเพิ่มเติม"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">รูปภาพสินค้า (อัปโหลดจาก iPad Photos / Files)</label>
          <input type="file" id="prod-image-file" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-xl text-sm" accept="image/*">
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-xl transition">บันทึกสินค้าลงระบบ</button>
      </form>
    </section>

    <!-- รายการสินค้าทั้งหมด -->
    <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
      <h2 class="text-lg font-bold mb-4"><i class="fas fa-boxes text-yellow-400"></i> จัดการสินค้าในระบบ</h2>
      <div id="admin-products-list" class="space-y-3"></div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function initAdmin() {
      const { data: games } = await supabase.from('games').select('*');
      const gameSelect = document.getElementById('prod-game');
      gameSelect.innerHTML = games.map(g => `<option value="${g.id}">${g.name}</option>`).join('');

      loadProducts();
    }

    async function loadProducts() {
      const { data: products } = await supabase.from('products').select('*, games(name)').order('created_at', { ascending: false });
      const list = document.getElementById('admin-products-list');
      
      list.innerHTML = products.map(p => `
        <div class="bg-slate-900 p-4 rounded-xl flex items-center justify-between border border-slate-800">
          <div>
            <span class="text-xs text-red-400 font-bold">${p.games?.name}</span>
            <h4 class="font-bold">${p.title}</h4>
            <div class="text-xs text-slate-400">ราคา: ฿${p.price} | สต็อก: ${p.stock} ชิ้น</div>
          </div>
          <div class="flex gap-2">
            <button onclick="toggleStock('${p.id}', ${p.stock})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${p.stock > 0 ? 'bg-orange-600' : 'bg-green-600'}">
              ${p.stock > 0 ? 'ปรับเป็นหมด' : 'เติมสต็อก'}
            </button>
            <button onclick="deleteProduct('${p.id}')" class="bg-red-950 text-red-400 hover:bg-red-900 px-3 py-1.5 rounded-lg text-xs font-bold">ลบ</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const gameId = document.getElementById('prod-game').value;
      const title = document.getElementById('prod-title').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const stock = parseInt(document.getElementById('prod-stock').value);
      const description = document.getElementById('prod-desc').value;
      const fileInput = document.getElementById('prod-image-file');

      let imageUrls = [];

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        
        // ใช้ Bucket Name ASIVARASHOP ที่ตั้งไว้ใน Storage
        const { data: storageData, error: uploadError } = await supabase.storage
          .from('ASIVARASHOP')
          .upload(fileName, file);

        if (!uploadError) {
          const { data: urlData } = supabase.storage.from('ASIVARASHOP').getPublicUrl(fileName);
          imageUrls.push(urlData.publicUrl);
        }
      }

      await supabase.from('products').insert([{
        game_id: gameId,
        title,
        price,
        stock,
        description,
        images: imageUrls
      }]);

      alert('บันทึกสินค้าลงระบบ ASIVARASHOP เรียบร้อย!');
      document.getElementById('add-product-form').reset();
      loadProducts();
    });

    async function toggleStock(id, currentStock) {
      const newStock = currentStock > 0 ? 0 : 1;
      await supabase.from('products').update({ stock: newStock }).eq('id', id);
      loadProducts();
    }

    async function deleteProduct(id) {
      if (confirm('ยืนยันที่จะลบสินค้านี้?')) {
        await supabase.from('products').delete().eq('id', id);
        loadProducts();
      }
    }

    initAdmin();
  </script>
</body>
</html>
